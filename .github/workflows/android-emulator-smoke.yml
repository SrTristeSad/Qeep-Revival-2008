name: Android emulator startup smoke

on:
  workflow_run:
    workflows: ["Build Android debug APK (LÖVE 11.5a)"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source revision that built the APK
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Download APK from successful build run
        uses: actions/download-artifact@v4
        with:
          name: Qeep-Revival-2008-Android-debug-APK
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: android-artifact
      - name: Install visual comparison dependency and run emulator-navigation unit tests
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 -m unittest discover -s tests -p 'test_android_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_android_navigation.py' -v
          python3 -m unittest discover -s tests -p 'test_android_server_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_android_login_smoke.py' -v
      - name: Install local-only Lua test server requirements
        run: sudo apt-get update && sudo apt-get install -y lua5.4 lua-socket
      - name: Enable KVM access on hosted Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and validate installed Qeep APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            python3 tools/android_smoke.py --apk android-artifact/Qeep-Revival-2008-Android-debug.apk --output android-smoke-results
            python3 tools/android_navigation.py --output android-navigation-results
            python3 tools/android_server_smoke.py --output android-server-results --start-local-server --server-log android-server.log --route-trace android-server-routes.log --verify-social-tcp --verify-android-login
      - name: Preserve screenshots, launcher output, and crashes even if startup fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qeep-Android-emulator-navigation-evidence
          path: |
            android-smoke-results/
            android-navigation-results/
            android-server-results/
            android-server.log
            android-server-routes.log
          if-no-files-found: warn

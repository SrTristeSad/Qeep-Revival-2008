name: Lua protocol and JCL tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check bytecode compatibility and protocol fixtures
        run: |
          lua5.4 tests/test_protocol.lua
          lua5.4 tests/test_jcl.lua
          find client server tests -name "*.lua" -print0 | xargs -0 -n1 luac5.4 -p

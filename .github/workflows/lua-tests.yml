name: Lua protocol, JCL and rendering-model tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4 lua-socket python3-pil
      - name: Check bytecode compatibility and protocol fixtures
        run: |
          lua5.4 tests/test_protocol.lua
          lua5.4 tests/test_jcl.lua
          lua5.4 tests/test_jcl_layout.lua
          lua5.4 tests/test_jcl_screen.lua
          lua5.4 tests/test_jcl_heading.lua
          lua5.4 tests/test_client_composition.lua
          lua5.4 tests/test_jcl_styles.lua
          lua5.4 tests/test_legacy_symbols.lua
          lua5.4 tests/test_jcl_choices.lua
          lua5.4 tests/test_client_choices.lua
          lua5.4 tests/test_client_smoke.lua
          lua5.4 tests/test_mobile_touch.lua
          lua5.4 tests/test_client_mobile.lua
          lua5.4 tests/test_client_mobile_viewport.lua
          lua5.4 tests/test_client_mobile_copy.lua
          lua5.4 tests/test_submit.lua
          lua5.4 tests/test_lab_host.lua
          lua5.4 tests/test_connection_settings.lua
          lua5.4 tests/test_client_connection.lua
          lua5.4 tests/test_lab_client.lua
          lua5.4 tests/test_jcl_history.lua
          lua5.4 tests/test_client_history.lua
          lua5.4 tests/test_social_routes.lua
          lua5.4 tests/test_client_social.lua
          lua5.4 tests/test_social_poll.lua
          lua5.4 tests/test_social_send.lua
          lua5.4 tests/test_tcp_loop.lua
          lua5.4 tests/test_account_store.lua
          lua5.4 tests/test_social_accounts.lua
          lua5.4 tests/test_social_store.lua
          lua5.4 tests/test_social_contacts.lua
          lua5.4 tests/test_social_unread.lua
          lua5.4 tests/test_social_unread_routes.lua
          lua5.4 tests/test_client_contacts.lua
          lua5.4 tests/test_client_poll.lua
          lua5.4 tests/test_original_logo.lua
          lua5.4 tests/test_legacy_viewport.lua
          lua5.4 tests/test_legacy_reference.lua
          lua5.4 tests/test_client_reference.lua
          lua5.4 tests/test_visual_capture.lua
          python3 tests/test_visual_tools.py
          python3 tests/test_j2me_capture.py
          python3 tests/test_visual_evidence.py
          python3 -m unittest discover -s tests -p 'test_android_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_android_navigation.py' -v
          python3 -m unittest discover -s tests -p 'test_android_server_smoke.py' -v
          python3 -m unittest discover -s tests -p 'test_android_login_smoke.py' -v
          python3 tests/test_registry_tokens.py
          python3 tests/test_import_jar_assets.py
          python3 -m py_compile tools/audit_visual_jar.py tools/j2me_preflight.py tools/compare_visual.py tools/j2me_capture.py tools/visual_evidence.py
          find client server tests -name "*.lua" -print0 | xargs -0 -n1 luac5.4 -p
      - name: Test real TCP localhost roundtrip
        run: |
          lua5.4 server/main.lua &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          lua5.4 tests/test_socket_roundtrip.lua
          lua5.4 tests/test_socket_social.lua
          lua5.4 tests/test_socket_concurrent.lua
          lua5.4 tests/test_socket_accounts.lua

name: Build Android debug APK (LÖVE 11.5a)

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'tools/package_android.py'
      - 'tests/test_package_android.py'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4G'
    steps:
      - name: Checkout Qeep Revival 2008
        uses: actions/checkout@v4
      - name: Checkout pinned official LÖVE Android 11.5a (recursive submodules)
        uses: actions/checkout@v4
        with:
          repository: love2d/love-android
          ref: 55feb38fa144f4734c26742389f279fb07d955c0
          path: .love-android
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
      - name: Install pinned Android NDK and SDK 34
        run: |
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0' 'ndk;25.2.9519653' 'cmake;3.22.1'
      - name: Test Android package preparation
        run: python3 -m unittest discover -s tests -p 'test_package_android.py' -v
      - name: Embed the Lua client (no original JAR assets)
        run: python3 tools/package_android.py --client client --love-android .love-android
      - name: Build debug-signed APK with official Gradle project
        working-directory: .love-android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleEmbedNoRecordDebug --no-daemon --stacktrace
      - name: Verify the debug APK and embedded game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import io, zipfile
          out=Path('.love-android/app/build/outputs/apk/embedNoRecord/debug')
          apks=list(out.glob('*.apk'))
          assert len(apks)==1, f'Expected 1 debug APK; found {apks}'
          with zipfile.ZipFile(apks[0]) as apk:
              data=apk.read('assets/game.love')
              assert any(x.startswith('lib/') and x.endswith('.so') for x in apk.namelist())
          with zipfile.ZipFile(io.BytesIO(data)) as game:
              assert 'main.lua' in game.namelist()
              assert not any(n.startswith('assets/original/') for n in game.namelist())
          Path('dist').mkdir(exist_ok=True)
          Path('dist/Qeep-Revival-2008-Android-debug.apk').write_bytes(apks[0].read_bytes())
          print(f'APK OK: {apks[0]}')
          PY
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify dist/Qeep-Revival-2008-Android-debug.apk
      - name: Upload debug APK (testing only)
        uses: actions/upload-artifact@v4
        with:
          name: Qeep-Revival-2008-Android-debug-APK
          path: dist/Qeep-Revival-2008-Android-debug.apk
          if-no-files-found: error
